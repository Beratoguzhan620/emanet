# Serves the web app and forwards the API. One origin, so the browser needs no CORS.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Photos are at most 10 MB; the API checks again.
    client_max_body_size 11m;

    location ~ ^/(api|scalar|openapi|health)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the single-page app. Text from the API is rendered as text; the policy is a second line of
    # defence: scripts and connections only from this origin, map tiles from OpenStreetMap, private condition photos
    # shown from memory (blob:), no framing. Location only for "near me", only when asked.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
